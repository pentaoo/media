<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Редактор темы карты · chinatown.site dev</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="stylesheet" href="/src/styles/pages/map-editor.css" />
    <script type="module" src="/src/js/pages/map-editor.js"></script>
  </head>
  <!-- Страница для разработки: её нет в vite.config.js, поэтому в сборку на GitHub Pages она не попадает. -->
  <body class="page page--map-editor">
    <div class="map-editor">
      <aside class="map-editor__panel" aria-label="Настройки темы">
        <header class="map-editor__head">
          <p class="map-editor__kicker">dev · maplibre и яндекс карты</p>
          <h1 class="map-editor__title">ТЕМА КАРТЫ</h1>
        </header>

        <fieldset class="map-editor__block">
          <legend>начать с пресета</legend>
          <div class="map-editor__presets" data-presets></div>
        </fieldset>

        <fieldset class="map-editor__block map-editor__row">
          <legend>общее</legend>
          <label class="map-editor__field map-editor__engine">карта
            <select id="opt-engine">
              <option value="maplibre">MapLibre · OpenStreetMap, без ключа</option>
              <option value="yandex">Яндекс Карты · нужен ключ</option>
            </select>
          </label>
          <label class="map-editor__check"><input type="checkbox" id="opt-dark" data-opt="dark" /> тёмная основа</label>
          <label class="map-editor__check"><input type="checkbox" id="opt-3d" data-opt="buildings3d" /> объёмные дома</label>
          <label class="map-editor__check"><input type="checkbox" id="opt-places" data-opt="places" checked /> тестовые точки</label>
        </fieldset>

        <fieldset class="map-editor__block map-editor__render" data-render>
          <legend>рендер и камера · MapLibre</legend>
          <label class="map-editor__check"><input type="checkbox" id="r-aa" data-r="antialias" /> сглаживание (antialias)</label>
          <label class="map-editor__field">плотность пикселей <input type="range" id="r-pr" data-r="pixelRatio" min="0" max="3" step="0.25" /> <output data-out="pixelRatio"></output></label>
          <label class="map-editor__field">появление подписей, мс <input type="range" id="r-fade" data-r="fadeDuration" min="0" max="1500" step="50" /> <output data-out="fadeDuration"></output></label>
          <label class="map-editor__field">наклон <input type="range" id="r-pitch" data-r="pitch" min="0" max="85" step="1" /> <output data-out="pitch"></output></label>
          <label class="map-editor__field">поворот <input type="range" id="r-bearing" data-r="bearing" min="-180" max="180" step="1" /> <output data-out="bearing"></output></label>
          <label class="map-editor__field">высота 3D-домов <input type="range" id="r-ext" data-r="extrusion" min="0.2" max="4" step="0.1" /> <output data-out="extrusion"></output></label>
          <label class="map-editor__field">свет: сила <input type="range" id="r-li" data-r="lightIntensity" min="0" max="1" step="0.05" /> <output data-out="lightIntensity"></output></label>
          <label class="map-editor__field">свет: цвет <input type="color" id="r-lc" data-r="lightColor" /></label>
          <label class="map-editor__field">свет: сторона <input type="range" id="r-la" data-r="lightAzimuth" min="0" max="360" step="5" /> <output data-out="lightAzimuth"></output></label>
          <label class="map-editor__field">свет: высота <input type="range" id="r-lp" data-r="lightPolar" min="0" max="90" step="5" /> <output data-out="lightPolar"></output></label>
          <label class="map-editor__field">дома с масштаба <input type="range" id="r-bz" data-r="buildingsMinZoom" min="12" max="17" step="1" /> <output data-out="buildingsMinZoom"></output></label>
          <label class="map-editor__field">номера домов с <input type="range" id="r-az" data-r="addressMinZoom" min="14" max="19" step="1" /> <output data-out="addressMinZoom"></output></label>
          <label class="map-editor__field">заведения с <input type="range" id="r-pz" data-r="poiMinZoom" min="13" max="19" step="1" /> <output data-out="poiMinZoom"></output></label>
          <button type="button" class="map-editor__preset" data-action="reset-render">сбросить рендер</button>
        </fieldset>

        <div class="map-editor__groups" data-groups></div>

        <fieldset class="map-editor__block">
          <legend>JSON для customization</legend>
          <textarea id="json" class="map-editor__json" spellcheck="false" rows="10" aria-describedby="json-status"></textarea>
          <p id="json-status" class="map-editor__status" aria-live="polite"></p>
          <div class="map-editor__actions">
            <button type="button" class="button button--ghost" data-action="copy">СКОПИРОВАТЬ</button>
            <button type="button" class="button button--ghost" data-action="apply-json">ПРИМЕНИТЬ JSON</button>
          </div>
        </fieldset>
      </aside>

      <main class="map-editor__stage">
        <div id="map" class="map-editor__map" aria-label="Карта Китай-города"></div>
        <div class="map-editor__notice" data-notice hidden></div>
      </main>
    </div>
  </body>
</html>
