<script>if(new URLSearchParams(location.search).get('width')==='320')document.documentElement.style.setProperty('--preview-width','320px');</script><h1>Мобильные элементы из Figma</h1><main>
<section><h2>388:748 · Основная кнопка / 32 px</h2><iframe title="Основная кнопка на телефоне" src="../../component-preview.html?family=action&variant=whitelist&dev=0"></iframe></section>
<section><h2>388:752 · Без фона / 32 px</h2><iframe title="Кнопка без фона на телефоне" src="../../component-preview.html?family=action&variant=secondary&dev=0"></iframe></section>
<section><h2>388:756 · Электропочта / 34 px</h2><iframe title="Электропочта на телефоне" src="../../component-preview.html?family=email&variant=empty&dev=0"></iframe></section>
</main><p>Живые экземпляры общих компонентов. Десктопный вариант основной кнопки сохраняет высоту 64 px.</p>
<script>
window.addEventListener('message', event => {
  if(event.origin !== location.origin || event.data?.type !== 'chinatown:component-preview') return;
  const frame = [...document.querySelectorAll('iframe')].find(item => item.contentWindow === event.source);
  if(frame) { frame.dataset.metrics = JSON.stringify(event.data); frame.dataset.state = event.data.state; }
});
</script></body></html>
