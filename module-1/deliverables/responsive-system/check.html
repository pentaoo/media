<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Проверка двух профилей</title><style>body{background:#111;color:#fff;margin:16px;font:14px system-ui}nav{position:sticky;z-index:2;top:0;background:#111;display:flex;gap:8px;padding:8px;flex-wrap:wrap}button{padding:10px}iframe{display:block;border:1px solid #444;transform-origin:top left}pre{white-space:pre-wrap;max-height:160px;overflow:auto}#viewport{overflow:auto;max-width:100%;max-height:1000px}</style></head><body><nav><button id="matrix">Матрица размеров</button><button data-width="320">320</button><button data-width="390">390</button><button data-width="760">760</button><button data-width="761">761</button><button data-width="1024">1024</button><button data-width="1440">1440</button><button data-page="index">Главная</button><button data-page="article">Статья</button><button data-page="about">О нас</button><button id="subscription">Открыть подписку</button><button id="submit">Проверить форму</button><button id="measure">Измерить</button></nav><pre id="report">Готово</pre><div id="viewport"><iframe title="Адаптивная страница" width="390" height="900" src="../../index.html?dev=0"></iframe></div><script>
const frame=document.querySelector('iframe'),report=document.querySelector('#report');let revision=0;
const settled=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
async function measure(){await frame.contentDocument.fonts.ready;await settled();const d=frame.contentDocument,w=frame.contentWindow;const nodes=[...d.querySelectorAll('[data-type-specimen] > :last-child, .action-button, .action-button__label, .email-field, .intro__headline, .intro__about, .story-cover__title, .story-section h2, .story-section__copy > p, .story-quote-scene__lyrics, .editorial-quote blockquote, .media-home__intro h1')].map(n=>{const s=w.getComputedStyle(n),box=n.getBoundingClientRect();return{role:n.parentElement.dataset.typeSpecimen||n.className,fontSize:s.fontSize,lineHeight:s.lineHeight,width:box.width,height:box.height,scrollWidth:n.scrollWidth,clientWidth:n.clientWidth,display:s.display,visible:!!n.getClientRects().length};});const buttons=[...d.querySelectorAll('.action-button')].filter(n=>n.getClientRects().length).map(n=>{const b=n.getBoundingClientRect(),g=n.querySelector('.action-button__content').getBoundingClientRect();return{width:b.width,groupWidth:g.width,centerDelta:Math.abs((b.left+b.width/2)-(g.left+g.width/2)),overflow:g.width>b.width+.5};});const intro=d.querySelector('#intro-content');const header=d.querySelector('.story-header__bar'),nav=[...d.querySelectorAll('.story-menu__item')].map(n=>{const b=n.getBoundingClientRect(),h=header.getBoundingClientRect();return{fontSize:w.getComputedStyle(n).fontSize,width:b.width,height:b.height,clipped:b.left<h.left-.5||b.right>h.right+.5||b.top<h.top-.5||b.bottom>h.bottom+.5};});const data={nav,url:w.location.href,viewport:w.innerWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,introOverflow:intro?intro.scrollWidth>intro.clientWidth:false,nodes,buttons};report.textContent=JSON.stringify(data,null,2);report.dataset.result=JSON.stringify(data);return data;}
async function load(url,width){revision++;frame.width=width;delete report.dataset.result;return new Promise(resolve=>{frame.addEventListener('load',async()=>{await measure();resolve();},{once:true});frame.src=url;});}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;delete report.dataset.result;if(b.dataset.width){frame.width=b.dataset.width;await measure();}if(b.dataset.page){await load('../../'+b.dataset.page+'.html?dev=0',frame.width);}if(b.id==='measure')await measure();if(b.id==='subscription'){const d=frame.contentDocument;d.querySelector('#intro-whitelist').click();await Promise.all([...d.querySelectorAll('#subscribe-modal *')].flatMap(n=>n.getAnimations()).filter(a=>a.effect?.getComputedTiming().iterations!==Infinity).map(a=>a.finished.catch(()=>{})));await measure();}if(b.id==='submit'){const d=frame.contentDocument;d.querySelector('#subscribe-email').value='reader@example.com';d.querySelector('#subscribe-form button').click();await settled();await measure();report.dataset.status=d.querySelector('#subscribe-status').textContent;}if(b.id==='matrix'){b.disabled=true;delete report.dataset.matrix;const results=[];for(const width of [320,390,600,760,761,1024,1440,1920])for(const family of ['typography','action','email']){await load('../../component-preview.html?family='+family+'&dev=0',width);await new Promise(resolve=>{const onMessage=e=>{if(e.source===frame.contentWindow&&e.data?.type==='chinatown:component-preview'){window.removeEventListener('message',onMessage);resolve();}};if(frame.contentDocument.body.dataset.previewReady)resolve();else window.addEventListener('message',onMessage);});results.push({family,...await measure()});}report.dataset.matrix=JSON.stringify(results);report.textContent='Готово: '+results.length+' проверок';b.disabled=false;}});
</script></body></html>
