<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Типографика из Figma · проверка</title><style>body{margin:0;padding:20px;background:#222;color:#fff;font:12px system-ui}h1{font-size:20px;margin:0 0 24px}main{display:flex;gap:20px;align-items:start}section{width:390px}p{margin:0 0 12px;color:#aaa}iframe{display:block;width:390px;height:1100px;border:1px solid #555}section:last-child,section:last-child iframe{width:320px}</style></head><body><h1>Мобильная типографика из Figma</h1><main><section><p>390 px · Display / H1 / H2 / H3 / Body / Caption / Quote</p><iframe title="Шкала на 390 px" src="../../component-preview.html?family=typography&variant=scale&dev=0"></iframe></section><section><p>320 px · переносы текста</p><iframe title="Шкала на 320 px" src="../../component-preview.html?family=typography&variant=scale&dev=0"></iframe></section></main><script>window.addEventListener('message',event=>{if(event.origin!==location.origin||event.data?.type!=='chinatown:component-preview')return;const frame=[...document.querySelectorAll('iframe')].find(frame=>frame.contentWindow===event.source);if(frame){frame.dataset.metrics=JSON.stringify(event.data);frame.dataset.state=event.data.state;}});</script></body></html>
