<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Проверка переходов и блоков</title><style>body{background:#111;color:white;font:14px system-ui;margin:16px}nav{position:sticky;top:0;background:#111;padding:12px;display:flex;gap:8px;flex-wrap:wrap}button{padding:10px}iframe{border:1px solid #444;display:block;transform-origin:top left}pre{white-space:pre-wrap}</style></head><body><nav><button data-width="1440">1440 px</button><button data-width="390">390 px</button><button data-width="320">320 px</button><button data-at="approach">Подход</button><button data-at="enter">Вход</button><button data-at="reading">Чтение</button><button data-at="leave">Выход</button><button data-at="reverse">Назад</button><button data-scene="quote">Припев</button><button data-scene="verse-excerpt">Куплет</button><button data-page="article">Статья</button><button data-page="timeline">Ряд</button><button data-page="fact">Факт</button><button data-page="scenarios">Сценарии</button></nav><pre id="report">Загрузка</pre><iframe title="Проверка статьи" width="1440" height="900" src="../../article.html?dev=0"></iframe><script>
const frame=document.querySelector('iframe'), report=document.querySelector('#report');let sceneId='quote',samples=[],capture=0,ready=false;
function sample(){const d=frame.contentDocument,w=frame.contentWindow,rail=d.querySelector('.scene-rail'),scene=d.getElementById(sceneId);if(!scene||!rail)return null;const style=w.getComputedStyle(rail);return{y:w.scrollY,phase:scene.dataset.quotePhase,media:Number(scene.style.getPropertyValue('--quote-media-opacity')),suspended:rail.classList.contains('is-suspended'),context:rail.dataset.contextState,material:rail.querySelector('[data-context-material]')?.id,visibility:style.visibility,opacity:style.opacity,videoHidden:rail.querySelector('video').hidden,overflow:d.documentElement.scrollWidth>w.innerWidth};}
function record(){samples=[];cancelAnimationFrame(capture);let n=0;function step(){const state=sample();if(state)samples.push(state);report.textContent=JSON.stringify({ready,last:state,frames:samples.length,visibleDuringScene:samples.filter(x=>x.media>0&&(x.visibility!=='hidden'||!x.suspended)).length},null,2);if(n++<70)capture=requestAnimationFrame(step);else{report.dataset.samples=JSON.stringify(samples);report.dataset.done='true';}}delete report.dataset.done;step();}
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data?.type==='chinatown:component-preview'){report.dataset.preview=JSON.stringify(e.data);}});
frame.addEventListener('load',async()=>{const d=frame.contentDocument;await d.fonts.ready;requestAnimationFrame(()=>requestAnimationFrame(()=>{ready=true;report.textContent='Готово';report.dataset.ready='true';}));});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const w=frame.contentWindow,d=frame.contentDocument;if(b.dataset.width){frame.width=b.dataset.width;frame.style.transform=Number(b.dataset.width)>1000?'scale(.8)':'none';return;}if(b.dataset.scene){sceneId=b.dataset.scene;report.textContent='Сцена: '+sceneId;return;}if(b.dataset.page){delete report.dataset.preview;delete report.dataset.ready;frame.src=b.dataset.page==='article'?'../../article.html?dev=0':'../../component-preview.html?family=timeline&variant='+b.dataset.page+'&dev=0';return;}if(b.dataset.at){const scene=d.getElementById(sceneId),scroll=scene.querySelector('.story-quote-scene__scroll'),height=w.innerHeight,top=scene.getBoundingClientRect().top+w.scrollY,runway=scroll.offsetHeight-height;const y={approach:top-height*.6,enter:top-height*.25,reading:top+100,leave:top+runway+height*.6,reverse:top-height*.25}[b.dataset.at];w.scrollTo({top:y,behavior:'instant'});record();}});
</script></body></html>
