<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <title>chinatown.site — медиа о нефорах</title>
    <link rel="icon" href="./assets/favicon/favicon.ico" sizes="48x48" />
    <link rel="icon" href="./assets/favicon/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./assets/favicon/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./assets/favicon/apple-touch-icon.png" />
    <link rel="preload" href="./assets/fonts/Benzin-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./assets/fonts/Benzin-Input-Bold.woff2" as="font" type="font/woff2" media="(min-width: 761px)" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./src/components/action-button.css" />
  </head>
  <body>
    <section class="intro intro--revealed" id="intro" aria-label="CHINATOWN.SITE — скоро">
      <div class="intro__wall" aria-hidden="true">
        <img src="./assets/video/concert.jpg" alt="" />
        <img src="./assets/video/dj.jpg" alt="" />
        <img src="./assets/video/concert.jpg" alt="" />
        <img src="./assets/video/moscow.jpg" alt="" />
        <img src="./assets/video/concert.jpg" alt="" />
        <img src="./assets/video/dj.jpg" alt="" />
      </div>
      <div class="intro__sphere" id="intro-sphere" role="group" tabindex="0" aria-label="Видеосфера: перетаскивайте, чтобы осмотреться. Также работают стрелки на клавиатуре."></div>
      <img class="intro__reference" src="./assets/figma/intro-background.png" alt="" aria-hidden="true" />
      <div class="intro__shade" aria-hidden="true"></div>
      <div class="intro__content" id="intro-content">
        <h1 class="heading-1 intro__headline" id="intro-headline">
          <span class="intro__line intro__faded">Скоро на</span>
          <span class="intro__line"><a class="intro__site-link" href="https://chinatown.site" target="_blank" rel="noopener noreferrer" aria-description="Enter — открыть сайт. Пробел — скопировать ссылку." aria-keyshortcuts="Space">chinatown.site</a><span class="intro__faded">&nbsp;–</span></span>
          <span class="intro__line intro__faded"><span class="intro__accent">медиа</span> о нефорах</span>
        </h1>
        <a class="text-button intro__about" id="intro-about" href="./about.html"><span>О НАС</span><img src="./assets/figma/intro-north-east.svg" alt="" aria-hidden="true" /></a>
        <div class="intro__bottom">
          <div class="intro__socials" aria-label="Социальные сети"><a href="https://t.me/chinatownsite" target="_blank" rel="noopener noreferrer">ТГ-КАНАЛ</a><a href="https://www.tiktok.com/@chinatownmedia" target="_blank" rel="noopener noreferrer">ТИКТОК</a></div>
          <button class="action-button intro__whitelist" data-action-button id="intro-whitelist" type="button" aria-haspopup="dialog" aria-controls="subscribe-modal">ПОПАСТЬ В ВАЙТ-ЛИСТ</button>
        </div>
        <p class="intro__copy-status" id="intro-copy-status" role="status" aria-live="polite"></p>
      </div>
    </section>
    <div class="subscribe-modal" id="subscribe-modal" hidden>
      <div class="subscribe-modal__backdrop" data-close-modal></div>
      <section class="subscribe-modal__panel" role="dialog" aria-modal="true" aria-labelledby="subscribe-title" aria-describedby="subscribe-description" tabindex="-1">
        <div class="subscribe-modal__deco" aria-hidden="true">
          <img src="./assets/figma/subscribe-star.svg" alt="" width="673.132" height="676.456" />
        </div>
        <div class="subscribe-modal__head" aria-hidden="true">
          <img src="./assets/figma/subscribe-head.webp" alt="" width="640" height="653" decoding="async" />
        </div>
        <div class="subscribe-modal__body">
          <div>
            <h2 id="subscribe-title">держим связь</h2>
            <p id="subscribe-description"><strong>подпишись на нас, чтобы участвовать в розыгрыше мерча,</strong> а&nbsp;также&nbsp;быть в курсе новостей медиа и тусовок на&nbsp;китай-городе.</p>
          </div>
          <form class="subscribe-modal__form" id="subscribe-form" action="https://formspree.io/f/xkjjgwgy" method="POST" novalidate>
            <label class="visually-hidden" for="subscribe-email">электропочта</label>
            <input class="email-field" id="subscribe-email" name="email" type="email" placeholder="ЭЛЕКТРОПОЧТА" autocomplete="email" inputmode="email" aria-describedby="subscribe-status" required />
            <button class="action-button" data-action-button type="submit">ПОДПИСАТЬСЯ</button>
            <p class="subscribe-modal__status" id="subscribe-status" role="status" aria-live="polite"></p>
          </form>
        </div>
        <button class="subscribe-modal__close" id="subscribe-close" type="button" aria-label="Закрыть окно"><img src="./assets/figma/subscribe-close.svg" alt="" aria-hidden="true" /></button>
      </section>
    </div>
    <script type="module" src="./src/focus-modality.js"></script>
    <script type="module" src="./src/intro.js"></script>
    <script type="module" src="./src/subscribe-modal.js"></script>
    <script type="module" src="./src/site-cursor.js"></script>
    <script type="module" src="./src/dev-tools.js"></script>
    <script type="module" src="./src/mat-gate.js"></script>
  </body>
</html>
